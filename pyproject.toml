[project]
name = "rowback"
version = "0.1.0"
description = "Row-level undo for PostgreSQL using logical decoding"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary>=2.9.9",
  "click>=8.1",
  "msgpack>=1.0",
  "zstandard>=0.22",
  "pglast>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "testcontainers>=4.4", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
rowback = "rowback.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rowback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
